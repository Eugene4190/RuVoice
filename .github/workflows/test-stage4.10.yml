name: RuVoice Stage 4.10 regression tests

on:
  push:
    branches: [main]
    paths:
      - "project/ruvoice-1.1.3-stage4.9/**"
      - ".github/workflows/test-stage4.10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip \
            --output /tmp/kotlin-compiler.zip
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  /tmp/kotlin-compiler.zip" | sha256sum --check
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Run real HTTP downloader integration tests
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: bash tools/run_http_download_tests.sh

      - name: Run existing download policy tests
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: bash tools/run_download_policy_tests.sh

      - name: Run install manifest tests
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: bash tools/run_install_manifest_policy_tests.sh

      - name: Run char accent policy tests
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: bash tools/run_char_accent_policy_tests.sh

      - name: Run context NLI tests
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: bash tools/run_omograph_context_tests.sh

      - name: Run stress merger tests
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: bash tools/run_stress_merger_tests.sh
