name: Build RuVoice Improved test APK

on:
  push:
    branches: [main]
    paths:
      - "project/ruvoice-1.1.3-stage4.9/app/**"
      - "project/ruvoice-1.1.3-stage4.9/native/**"
      - "project/ruvoice-1.1.3-stage4.9/tools/**"
      - "project/ruvoice-1.1.3-stage4.9/build.gradle.kts"
      - "project/ruvoice-1.1.3-stage4.9/settings.gradle.kts"
      - ".github/workflows/build-improved-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install a pinned Android command-line SDK, platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          TOOL_ZIP="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest" "$RUNNER_TEMP/android-cli-unpack"
          curl --fail --location --retry 3 --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$TOOL_ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $TOOL_ZIP" | sha256sum --check
          unzip -q "$TOOL_ZIP" -d "$RUNNER_TEMP/android-cli-unpack"
          test -x "$RUNNER_TEMP/android-cli-unpack/cmdline-tools/bin/sdkmanager"
          cp -a "$RUNNER_TEMP/android-cli-unpack/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Download official RuVoice 1.1.3 runtime assets
        shell: bash
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: |
          set -euo pipefail
          mkdir -p /tmp/ruvoice-upstream app/src/full/assets/silero app/libs
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/kost-t-human/ruvoice-tts/releases/download/v1.1.3/ruvoice-tts-1.1.3.apk \
            --output /tmp/ruvoice-upstream/ruvoice-tts-1.1.3.apk
          echo "b67e64ec05749032c8edfd746b4e039e6f261ac9801ff17c6ccdfc8e7c4d6acb  /tmp/ruvoice-upstream/ruvoice-tts-1.1.3.apk" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          source = Path("/tmp/ruvoice-upstream/ruvoice-tts-1.1.3.apk")
          target = Path("app/src/full/assets/silero")
          required = [
              "accentor.ptl", "backbone.pte", "head.ptl",
              "homo.ptl", "stress.bin", "tts_mel.ptl",
          ]
          with ZipFile(source) as apk:
              for name in required:
                  entry = f"assets/silero/{name}"
                  data = apk.read(entry)
                  if not data:
                      raise SystemExit(f"Empty official runtime asset: {entry}")
                  (target / name).write_bytes(data)
                  print(f"Restored {entry}: {len(data)} bytes")
          missing = [name for name in required if not (target / name).is_file()]
          if missing:
              raise SystemExit(f"Missing official Silero assets: {missing}")
          PY

      - name: Download ExecuTorch Android runtime AAR
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://ossci-android.s3.amazonaws.com/executorch/release/1.5.0-xnnpack/executorch.aar \
            --output app/libs/executorch-1.5.0-xnnpack.aar
          unzip -tq app/libs/executorch-1.5.0-xnnpack.aar
          unzip -l app/libs/executorch-1.5.0-xnnpack.aar | grep -q 'classes.jar'
          echo "ExecuTorch AAR downloaded and ZIP-validated"

      - name: Cross-compile Rust Hugging Face tokenizers for Android ARM64
        id: rust-tokenizers
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/ruvoice-rust-android-build-final.log"
          {
            set -x
            rustc --version --verbose
            cargo --version
            NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
            TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
            LINKER="$TOOLCHAIN/aarch64-linux-android23-clang"
            test -x "$LINKER" || exit 21
            rustup target add aarch64-linux-android || exit 22
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LINKER"
            export CC_aarch64_linux_android="$LINKER"
            export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
            cargo build --manifest-path native/Cargo.toml --target aarch64-linux-android --release --verbose || exit $?
            LIB="native/target/aarch64-linux-android/release/libruvoice_tokenizers.so"
            test -s "$LIB" || exit 23
            mkdir -p app/src/main/jniLibs/arm64-v8a
            install -m 0644 "$LIB" app/src/main/jniLibs/arm64-v8a/libruvoice_tokenizers.so || exit $?
            file app/src/main/jniLibs/arm64-v8a/libruvoice_tokenizers.so
            readelf -h app/src/main/jniLibs/arm64-v8a/libruvoice_tokenizers.so | grep -E 'Class:|Machine:'
            readelf -h app/src/main/jniLibs/arm64-v8a/libruvoice_tokenizers.so | grep -q 'Machine:.*AArch64' || exit 24
          } 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          cp "$LOG" "$RUNNER_TEMP/ruvoice-rust-android-build-final.log"
          echo "Rust/NDK build exit code: $STATUS"
          exit "$STATUS"

      - name: Preserve Rust/NDK diagnostic log after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ruvoice-rust-android-build-final.log"
          mkdir -p private-files
          DIAGNOSTIC="private-files/ruvoice-build-diagnostics-${GITHUB_RUN_ID}.log"
          cp "$RUNNER_TEMP/ruvoice-rust-android-build-final.log" "$DIAGNOSTIC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIAGNOSTIC"
          git commit -m "Save Rust Android build diagnostics for run ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Restore UTF-8 filenames for bundled system dictionaries
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/restore_unicode_asset_names.py
          test -s "app/src/main/assets/dicts/stress/Системный.txt"
          test -s "app/src/main/assets/dicts/replace/Системный.txt"

      - name: Run Android unit tests and build separate RuVoice Improved APK
        id: android-build
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/ruvoice-android-gradle-build-final.log"
          gradle --no-daemon --stacktrace :app:testFullDebugUnitTest :app:assembleFullDebug 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          cp "$LOG" "$RUNNER_TEMP/ruvoice-android-gradle-build-final.log"
          echo "Android Gradle build exit code: $STATUS"
          exit "$STATUS"

      - name: Preserve Android Gradle diagnostics after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ruvoice-android-gradle-build-final.log"
          # Include the exact failing JUnit cases; Gradle's default console only links the HTML report.
          python3 - <<'PY' >> "$RUNNER_TEMP/ruvoice-android-gradle-build-final.log"
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("project/ruvoice-1.1.3-stage4.9/app/build/test-results/testFullDebugUnitTest")
          print("\\n===== JUNIT FAILURE DETAILS =====")
          if not root.exists():
              print(f"No JUnit XML directory found: {root}")
          else:
              found = 0
              for report in sorted(root.glob("TEST-*.xml")):
                  try:
                      suite = ET.parse(report).getroot()
                  except Exception as error:
                      print(f"Could not parse {report}: {error}")
                      continue
                  for case in suite.iter("testcase"):
                      for failure in list(case.findall("failure")) + list(case.findall("error")):
                          found += 1
                          print(f"\\nFAIL {case.get('classname')}.{case.get('name')}")
                          print(f"message: {failure.get('message', '')}")
                          print(f"type: {failure.get('type', '')}")
                          print(failure.text or "(no stack trace)")
              if not found:
                  print("No failure/error elements were found in JUnit XML.")
          print("===== END JUNIT FAILURE DETAILS =====")
          PY
          mkdir -p private-files
          DIAGNOSTIC="private-files/ruvoice-gradle-diagnostics-${GITHUB_RUN_ID}.log"
          cp "$RUNNER_TEMP/ruvoice-android-gradle-build-final.log" "$DIAGNOSTIC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIAGNOSTIC"
          git commit -m "Save Android Gradle diagnostics for run ${GITHUB_RUN_ID}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify APK package, TTS engine, and ARM64 native libraries
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/full/debug/app-full-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/ruvoice-badging.txt
          grep -q "package: name='ru.kost.ruvoice.improved.stage416'" /tmp/ruvoice-badging.txt
          grep -q "versionCode='10110' versionName='1.1.3-improved-4.16'" /tmp/ruvoice-badging.txt
          grep -q "application-label:'RuVoice Improved'" /tmp/ruvoice-badging.txt
          unzip -tq "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          required = [
              "lib/arm64-v8a/libruvoice_tokenizers.so",
              "lib/arm64-v8a/libexecutorch.so",
              "lib/arm64-v8a/libpytorch_jni_lite.so",
              "assets/silero/tts_mel.ptl",
              "assets/silero/backbone.pte",
              "assets/silero/head.ptl",
              "assets/silero/accentor.ptl",
              "assets/silero/homo.ptl",
          ]
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
              missing = [path for path in required if path not in names]
              if missing:
                  raise SystemExit(f"APK is missing required runtime files: {missing}")
              onnx = [p for p in names if p.startswith("lib/arm64-v8a/") and "onnx" in p.lower()]
              if not onnx:
                  raise SystemExit("APK contains no ARM64 ONNX Runtime native library")
              print("Verified required native/runtime assets:")
              for path in required + onnx:
                  print(" -", path)
          PY
          mkdir -p dist
          cp "$APK" dist/ruvoice-improved-1.1.3.apk
          sha256sum dist/ruvoice-improved-1.1.3.apk
          ls -lh dist/ruvoice-improved-1.1.3.apk

      - name: Download and verify official Ilya voice pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/kost-t-human/ruvoice-tts/releases/download/packs/ruvoice-pack-ru_voices.zip \
            --output private-files/ruvoice-pack-ru_voices.zip
          unzip -tq private-files/ruvoice-pack-ru_voices.zip
          echo "6a1084e8693dbf581a9ee91b7376909aa9b5177efa9d760685d5315d430c1520  private-files/ruvoice-pack-ru_voices.zip" | sha256sum --check
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          p = Path("private-files/ruvoice-pack-ru_voices.zip")
          with zipfile.ZipFile(p) as archive:
              meta = json.loads(archive.read("pack.json"))
              speakers = meta.get("speakers", {})
              if meta.get("id") != "ru_voices" or "ilya" not in speakers:
                  raise SystemExit("Official Ilya speaker pack failed validation")
              print(f"Verified voice pack: {meta.get('title')} — Ilya speaker id {speakers['ilya']}")
          PY

      - name: Write Stage 4.16 build report and source ZIP
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA="$(sha256sum dist/ruvoice-improved-1.1.3.apk | awk '{print $1}')"
          APK_SIZE="$(stat -c%s dist/ruvoice-improved-1.1.3.apk)"
          cat > PHASE4_14_STATUS_RU.md <<EOF
          # Этап 4.16 — явная диагностика RUAccent в «Разборе»

          ## Что подтверждено

          - Реальный RUAccent INT8 загружен из закреплённой ревизии Hugging Face: 16 файлов, 144 301 606 байт.
          - Все четыре ONNX-сессии созданы, warm-up и четыре русских smoke-примера пройдены в JVM на Linux.
          - Для всех 16 файлов закреплены SHA-256; установщик сверяет каждый файл до пометки «установлено».
          - `nn_accent/vocab.txt` проверяется по фиксированным спецтокенам и русским гласным, а не по ошибочному порогу в 100 строк; штатный словарь содержит 44 токена и 140 байт.
          - «Разбор» показывает два читаемых варианта: штатный результат RuVoice до RUAccent и итог после RUAccent; знак ударения отображается обычным акутом, не внутренним символом «+».
          - После двух вариантов «Разбор» перечисляет только изменённые слова в формате «слово: было → стало»; если изменений нет, прямо пишет, что RUAccent согласился со штатным RuVoice.
          - Английские метки STRESS/NO_STRESS заменены понятными русскими счётчиками.
          - RUAccent не переопределяет ударения, уже назначенные грамматическим проходом или контекстным BERT-омографом RuVoice; обычные автоматические ударения акцентора по-прежнему могут быть скорректированы.
          - Добавлены регрессионные тесты: неправильное RUAccent «руки́» не перезаписывает «р+уки» после предлога «в»; отдельный тест подтверждает, что RUAccent не меняет ударение, уже выбранное штатным BERT для омографа «замок».
          - Имя Android TTS-службы явно обозначено как `RuVoice Improved — RUAccent`, чтобы отличать её от штатного RuVoice в списке движков.
          - Настоящий HTTP Range downloader прошёл локальные сценарии прерывания/возобновления, игнорирования Range, неверного Content-Range и HTTP 416.
          - Официальный пакет ru_voices проверен: speaker \`ilya\` присутствует под id 20.
          - Минимальная версия Android для этой модификации: API 24 (Android 7.0), требование ONNX Runtime 1.32.0; целевой Xiaomi работает на Android 13.
          - APK Stage 4.16 получил отдельный applicationId \`ru.kost.ruvoice.improved.stage416\`, поэтому устанавливается рядом с официальным RuVoice и предыдущими тестовыми версиями без удаления старых копий.
          - У новой копии собственное хранилище: голосовой пакет и модель RUAccent устанавливаются отдельно; данные предыдущих версий не затрагиваются.
          - Сохранены оригинальные Silero v5_5_ru assets из официального RuVoice 1.1.3. Голос Ilya доступен через официальный пакет ru_voices.

          ## Сборка

          - Variant: \`fullDebug\`, ARM64.
          - Unit tests: \`:app:testFullDebugUnitTest\`.
          - APK: \`ruvoice-improved-1.1.3.apk\`.
          - APK bytes: $APK_SIZE.
          - APK SHA-256: \`$APK_SHA\`.

          ## Установка и первый запуск

          1. Установить APK рядом с официальным RuVoice.
          2. В RuVoice Improved открыть «Голос» и установить пакет голосов \`ruvoice-pack-ru_voices.zip\` через «Дополнительные голоса».
          3. Выбрать \`ilya\`.
          4. В разделе голоса нажать «Загрузить офлайн-модель RUAccent». Загрузка около 144 МБ, поддерживает возобновление.
          5. После успешной активации обработка выполняется локально и не отправляет текст книги в сеть.

          ## Не подтверждено

          - Физический запуск и производительность на Xiaomi Redmi Note 12 Pro 4G / Snapdragon 732G.
          - Расход RAM, температура и задержка синтеза на телефоне.
          - Сравнительная точность на реальной EPUB-книге относительно штатного RuVoice.
          - APK собран с debug signing; отдельный package id Stage 4.16 позволяет поставить его рядом с предыдущими экспериментальными сборками без конфликта подписи.

          Это экспериментальная сборка для установки рядом с оригиналом, а не официальный релиз RuVoice.
          EOF
          cd ..
          mkdir -p ../private-files
          zip -qr ../private-files/ruvoice-1.1.3-stage4.16.zip ruvoice-1.1.3-stage4.9 \
            -x '*/.git/*' '*/.gradle/*' '*/app/build/*' '*/native/target/*' '*/local.properties' '*/dist/*'
          unzip -tq ../private-files/ruvoice-1.1.3-stage4.16.zip

      - name: Keep generated report in the release archive without pushing from CI
        shell: bash
        run: |
          set -euo pipefail
          # The report and reproducible source ZIP are attached to the release.
          # Do not push a report commit from parallel CI jobs: that previously
          # caused races and rebase conflicts after the APK had already built.
          git restore --worktree --source=HEAD -- \
            project/ruvoice-1.1.3-stage4.9/app/src/main/assets/dicts
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Unexpected tracked worktree changes remain:"
            git status --short
            exit 1
          fi

      - name: Publish private test release with APK and source archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ruvoice-improved-1.1.3-stage4.16
          name: RuVoice Improved 1.1.3 — Stage 4.16 readable RUAccent comparison
          prerelease: true
          generate_release_notes: true
          files: |
            project/ruvoice-1.1.3-stage4.9/dist/ruvoice-improved-1.1.3.apk
            private-files/ruvoice-1.1.3-stage4.16.zip
            private-files/ruvoice-pack-ru_voices.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
