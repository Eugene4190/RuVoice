name: Inspect official RuVoice 1.1.3 build inputs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-upstream-1.1.3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official v1.1.3 APK and Russian voices pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ruvoice-upstream
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/kost-t-human/ruvoice-tts/releases/download/v1.1.3/ruvoice-tts-1.1.3.apk \
            --output /tmp/ruvoice-upstream/ruvoice-tts-1.1.3.apk
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/kost-t-human/ruvoice-tts/releases/download/packs/ruvoice-pack-ru_voices.zip \
            --output /tmp/ruvoice-upstream/ruvoice-pack-ru_voices.zip
          unzip -tq /tmp/ruvoice-upstream/ruvoice-tts-1.1.3.apk
          unzip -tq /tmp/ruvoice-upstream/ruvoice-pack-ru_voices.zip
          sha256sum /tmp/ruvoice-upstream/*
          ls -lh /tmp/ruvoice-upstream

      - name: Inspect APK payload and verify Ilya pack entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile, hashlib
          from pathlib import Path

          root = Path("/tmp/ruvoice-upstream")
          apk = root / "ruvoice-tts-1.1.3.apk"
          pack = root / "ruvoice-pack-ru_voices.zip"

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          lines = ["# Проверка официальных входных файлов RuVoice 1.1.3", ""]
          with zipfile.ZipFile(apk) as z:
              entries = z.infolist()
              silero = [x for x in entries if x.filename.startswith("assets/silero/") and not x.is_dir()]
              native = [x for x in entries if x.filename.startswith("lib/arm64-v8a/") and not x.is_dir()]
              lines += [
                  "## Официальный APK",
                  f"- ZIP entries: {len(entries)}",
                  f"- assets/silero files: {len(silero)} ({sum(x.file_size for x in silero)} bytes)",
                  f"- arm64 native libraries: {len(native)}",
                  f"- APK SHA-256: {sha256(apk)}",
                  "",
                  "### Assets / Silero",
              ]
              lines += [f"- {x.filename}: {x.file_size} bytes" for x in silero]
              lines += ["", "### Native arm64 libraries"]
              lines += [f"- {x.filename}: {x.file_size} bytes" for x in native]

          with zipfile.ZipFile(pack) as z:
              names = z.namelist()
              if "pack.json" not in names:
                  raise SystemExit("Official ru_voices pack has no pack.json")
              meta = json.loads(z.read("pack.json"))
              speakers = meta.get("speakers", {})
              ilya_keys = [name for name in speakers if "ilya" in name.lower()]
              lines += [
                  "",
                  "## Официальный ru_voices pack",
                  f"- Pack id: {meta.get('id')}",
                  f"- Title: {meta.get('title')}",
                  f"- License: {meta.get('license')}",
                  f"- Format: {meta.get('format')}",
                  f"- Language: {meta.get('lang')}",
                  f"- Speaker count: {len(speakers)}",
                  f"- Ilya entries: {ilya_keys}",
                  f"- Pack SHA-256: {sha256(pack)}",
                  "",
                  "### Speakers",
              ]
              lines += [f"- {name}: {speaker_id}" for name, speaker_id in speakers.items()]
              if not ilya_keys:
                  raise SystemExit("The official ru_voices pack did not contain an Ilya speaker entry")

          out = Path("private-files/ruvoice-upstream-build-inputs-1.1.3.md")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Commit the reproducible inspection report and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add private-files/ruvoice-upstream-build-inputs-1.1.3.md
          git rm -f .github/workflows/inspect-upstream-1.1.3.yml
          git commit -m "Record official RuVoice 1.1.3 build input inspection"
          git push origin HEAD:main
