name: Unpack RuVoice Stage 4.9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unpack-stage4.9.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Safely extract project archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archive = Path("private-files/ruvoice-1.1.3-stage4.9.zip")
          target = Path("project")

          if not archive.is_file():
              raise SystemExit(f"Archive not found: {archive}")
          if target.exists() and any(target.iterdir()):
              raise SystemExit(f"Refusing to overwrite non-empty directory: {target}")

          target.mkdir(parents=True, exist_ok=True)
          written = 0
          total_bytes = 0
          skipped = 0

          with ZipFile(archive) as zf:
              entries = zf.infolist()
              if len(entries) > 20000:
                  raise SystemExit(f"Archive has too many entries: {len(entries)}")

              for item in entries:
                  raw = item.filename.replace("\\", "/")
                  path = PurePosixPath(raw)

                  if path.is_absolute() or not path.parts or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if path.parts[0] == ".git" or "__MACOSX" in path.parts or path.name == ".DS_Store":
                      skipped += 1
                      continue

                  mode = item.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink is not allowed in archive: {item.filename}")

                  out = target.joinpath(*path.parts)
                  if item.is_dir():
                      out.mkdir(parents=True, exist_ok=True)
                      continue

                  if item.file_size > 90 * 1024 * 1024:
                      raise SystemExit(f"File exceeds GitHub's safe per-file limit (90 MiB): {item.filename}")
                  total_bytes += item.file_size
                  if total_bytes > 1500 * 1024 * 1024:
                      raise SystemExit("Expanded archive exceeds 1.5 GiB safety limit")

                  out.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(item) as src, out.open("wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
                  written += 1

          print(f"Extracted {written} files ({total_bytes} bytes); skipped {skipped} metadata entries.")
          PY

      - name: Commit extracted project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/
          if git diff --cached --quiet; then
            echo "No extracted files to commit."
            exit 0
          fi
          git commit -m "Extract RuVoice Stage 4.9 project archive"
          git push origin HEAD:main
