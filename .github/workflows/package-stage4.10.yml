name: Package RuVoice Stage 4.10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/package-stage4.10.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create and verify project ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="project/ruvoice-1.1.3-stage4.9"
          OUTPUT="private-files/ruvoice-1.1.3-stage4.10.zip"
          test -f "$PROJECT/app/src/main/java/ru/kost/ruvoice/text/RuAccentHttpDownloader.kt"
          test -f "$PROJECT/tools/test_ruaccent_http_downloader.kt"
          rm -f "$OUTPUT"
          zip -qr "$OUTPUT" "$PROJECT"
          unzip -tq "$OUTPUT"
          sha256sum "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Commit ZIP and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add private-files/ruvoice-1.1.3-stage4.10.zip
          git rm -f .github/workflows/package-stage4.10.yml
          git commit -m "Package RuVoice Stage 4.10 project ZIP"
          git push origin HEAD:main
