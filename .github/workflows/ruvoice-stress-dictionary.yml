name: RuVoice stress dictionary tools

on:
  pull_request:
    paths:
      - "experiments/ruvoice-stress-dictionary/**"
      - ".github/workflows/ruvoice-stress-dictionary.yml"
  push:
    branches:
      - stress-dictionary-pipeline
    paths:
      - "experiments/ruvoice-stress-dictionary/**"
      - ".github/workflows/ruvoice-stress-dictionary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python tools
        run: |
          python -m py_compile \
            experiments/ruvoice-stress-dictionary/build_dictionary.py \
            experiments/ruvoice-stress-dictionary/analyze_book.py \
            experiments/ruvoice-stress-dictionary/test_build_dictionary.py \
            experiments/ruvoice-stress-dictionary/test_analyze_book.py

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s experiments/ruvoice-stress-dictionary \
            -p "test_*.py" -v

      - name: Validate shell syntax
        run: bash -n experiments/ruvoice-stress-dictionary/run_pipeline.sh

      - name: Validate dictionary snapshot
        run: |
          python experiments/ruvoice-stress-dictionary/build_dictionary.py \
            --source-list project/ruvoice-1.1.3-stage4.9/tools/stress_fixes.txt \
            --output "$RUNNER_TEMP/RuVoice_Stage4.9_ExistingFixes.txt" \
            --report "$RUNNER_TEMP/Stage4.9_review.tsv" \
            --manifest "$RUNNER_TEMP/Stage4.9_manifest.json"
