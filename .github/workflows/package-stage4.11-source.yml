name: Package RuVoice Improved Stage 4.11 source
# Keep the source archive in sync with the latest project tree on main.
# This workflow also restores any legacy #U-codepoint asset names before archiving.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-stage4.11-source.yml"
      - "project/ruvoice-1.1.3-stage4.9/**"
  workflow_dispatch:

# Do not let two packaging runs publish archives from different snapshots at once.
concurrency:
  group: package-stage4.11-source-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create, verify, and publish the current source ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="private-files/ruvoice-1.1.3-stage4.11-source.zip"
          mkdir -p private-files

          # A newer source commit can land while this job is packaging. In that
          # case, discard the stale local attempt, fetch main again, and rebuild
          # the ZIP from the new snapshot instead of pushing an outdated archive.
          for attempt in 1 2 3 4 5; do
            echo "Preparing Stage 4.11 source archive (attempt ${attempt}/5)."
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD

            rm -f "$OUTPUT"
            python3 project/ruvoice-1.1.3-stage4.9/tools/restore_unicode_asset_names.py
            # The checked-in dictionaries are generated from stress_fixes.txt and related sources.
            python3 project/ruvoice-1.1.3-stage4.9/tools/system_dicts.py
            grep -Eq '^снято[[:space:]]+сн\\+ято([[:space:]]|$)' \
              project/ruvoice-1.1.3-stage4.9/app/src/main/assets/dicts/stress/Системный.txt
            zip -qr "$OUTPUT" project/ruvoice-1.1.3-stage4.9 \
              -x '*/.git/*' '*/.gradle/*' '*/app/build/*' '*/native/target/*' \
                 '*/local.properties' '*/dist/*' '*/app/libs/*.aar'
            unzip -tq "$OUTPUT"
            sha256sum "$OUTPUT"
            ls -lh "$OUTPUT"

            git add -A project/ruvoice-1.1.3-stage4.9/app/src/main/assets/dicts
            git add "$OUTPUT"
            if git diff --cached --quiet; then
              echo "Source tree and archive are already up to date."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Restore Unicode dictionary asset names and package Stage 4.11 source"

            if git push origin HEAD:main; then
              echo "Published Stage 4.11 source archive."
              exit 0
            fi

            echo "main advanced during publication; refreshing and rebuilding."
          done

          echo "Could not publish a current source archive after 5 attempts." >&2
          exit 1
