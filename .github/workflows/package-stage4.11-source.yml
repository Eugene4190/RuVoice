name: Package RuVoice Improved Stage 4.11 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-stage4.11-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-files
          OUTPUT="private-files/ruvoice-1.1.3-stage4.11-source.zip"
          rm -f "$OUTPUT"
          zip -qr "$OUTPUT" project/ruvoice-1.1.3-stage4.9 \
            -x '*/.git/*' '*/.gradle/*' '*/app/build/*' '*/native/target/*' \
               '*/local.properties' '*/dist/*' '*/app/libs/*.aar'
          unzip -tq "$OUTPUT"
          sha256sum "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Commit source ZIP to the private repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add private-files/ruvoice-1.1.3-stage4.11-source.zip
          git commit -m "Package RuVoice Improved Stage 4.11 source ZIP"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
