name: Evaluate real uploaded EPUB with RUAccent (retry)

on:
  push:
    branches: [main]
    paths:
      - "private-files/8.Iskusstvo..epub"
      - "project/ruvoice-1.1.3-stage4.9/tools/test_ruaccent_uploaded_book.kt"
      - "project/ruvoice-1.1.3-stage4.9/tools/run_ruaccent_uploaded_book_eval.sh"
      - ".github/workflows/evaluate-uploaded-epub.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-book:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out private repository and uploaded book
        uses: actions/checkout@v4

      - name: Record this evaluation run ID for direct diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-files
          cat > private-files/ruaccent-book-run.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT",
            "run_url": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "commit": "$GITHUB_SHA"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f private-files/ruaccent-book-run.json
          git commit -m "Record real EPUB RUAccent evaluation run"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip \
            --output /tmp/kotlin-compiler.zip
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  /tmp/kotlin-compiler.zip" | sha256sum --check
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Run production RUAccent Kotlin/ONNX pipeline over the whole EPUB
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run_ruaccent_uploaded_book_eval.sh \
            "$GITHUB_WORKSPACE/private-files/8.Iskusstvo..epub" \
            "$GITHUB_WORKSPACE/private-files/ruaccent-real-book-analysis.json"

      - name: Upload private book evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ruaccent-uploaded-book-evaluation
          path: private-files/ruaccent-real-book-analysis.json
          if-no-files-found: error
          retention-days: 14

      - name: Save compact evaluation report in the private repository
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f private-files/ruaccent-real-book-analysis.json
          if git diff --cached --quiet; then
            echo "Evaluation report is unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Save real EPUB RUAccent analysis report"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
