name: Build RuVoice Book Tool for Windows

on:
  pull_request:
    paths:
      - "experiments/ruvoice-stress-dictionary/**"
      - "project/ruvoice-1.1.3-stage4.9/app/src/main/assets/dicts/stress/Системный.txt"
      - "private-files/paired_eval/book_reviewed_replacements.txt"
      - "private-files/paired_eval/book_reviewed_overrides.txt"
      - "private-files/paired_eval/book_reviewed_text_cleanup.txt"
      - "private-files/paired_eval/book_context_acceptances.tsv"
      - "private-files/paired_eval/BOOK_REVIEWED_OVERRIDES.md"
      - "experiments/ruvoice-stress-dictionary/reports/8-Iskusstvo-stress-movements-review.tsv"
      - ".github/workflows/build-ruvoice-book-tool-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build one-file Windows executable
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $tool = Join-Path $root "experiments\ruvoice-stress-dictionary"
          $out = Join-Path $env:RUNNER_TEMP "ruvoice-win-build"
          $dist = Join-Path $out "dist"
          $work = Join-Path $out "work"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $system = Join-Path $root "project\ruvoice-1.1.3-stage4.9\app\src\main\assets\dicts\stress\Системный.txt"
          $pool = Join-Path $tool "output\RuVoice_AutoStress.txt"
          $audit = Join-Path $tool "reports\RuVoice_AutoStress_accepted.tsv"
          $rules = Join-Path $tool "data\curated\book_candidate_review_rules.tsv"
          $phrases = Join-Path $root "private-files\paired_eval\book_reviewed_replacements.txt"
          $textCleanup = Join-Path $root "private-files\paired_eval\book_reviewed_text_cleanup.txt"
          $reviewedOverrides = Join-Path $root "private-files\paired_eval\book_reviewed_overrides.txt"
          $contextAcceptances = Join-Path $root "private-files\paired_eval\book_context_acceptances.tsv"
          $overrideNotes = Join-Path $root "private-files\paired_eval\BOOK_REVIEWED_OVERRIDES.md"
          $movementReview = Join-Path $root "experiments\ruvoice-stress-dictionary\reports\8-Iskusstvo-stress-movements-review.tsv"

          foreach ($path in @($system, $pool, $audit, $rules, $phrases, $textCleanup, $reviewedOverrides, $contextAcceptances, $overrideNotes, $movementReview)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required bundled resource is missing: $path"
            }
          }

          $pyArgs = @(
            "--noconfirm", "--clean", "--onefile", "--console",
            "--name", "RuVoiceBookTool",
            "--distpath", $dist,
            "--workpath", $work,
            "--specpath", $out,
            "--paths", $tool,
            "--add-data", "$system;project/ruvoice-1.1.3-stage4.9/app/src/main/assets/dicts/stress",
            "--add-data", "$pool;experiments/ruvoice-stress-dictionary/output",
            "--add-data", "$audit;experiments/ruvoice-stress-dictionary/reports",
            "--add-data", "$rules;experiments/ruvoice-stress-dictionary/data/curated",
            "--add-data", "$phrases;private-files/paired_eval",
            "--add-data", "$textCleanup;private-files/paired_eval",
            "--add-data", "$reviewedOverrides;private-files/paired_eval",
            "--add-data", "$contextAcceptances;private-files/paired_eval",
            "--add-data", "$overrideNotes;private-files/paired_eval",
            "--add-data", "$movementReview;experiments/ruvoice-stress-dictionary/reports",
            (Join-Path $tool "private_book_server.py")
          )
          & pyinstaller @pyArgs
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path (Join-Path $dist "RuVoiceBookTool.exe"))) {
            throw "PyInstaller did not produce RuVoiceBookTool.exe"
          }

      - name: Smoke-test the packaged upload, processing and ZIP download
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "ruvoice-win-build\dist\RuVoiceBookTool.exe"
          $privateHome = Join-Path $env:RUNNER_TEMP "ruvoice-portable-private"
          $port = 18765
          $epub = Join-Path $env:RUNNER_TEMP "ruvoice-portable-smoke.epub"
          $zip = Join-Path $env:RUNNER_TEMP "ruvoice-portable-smoke-result.zip"

          @'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path, "w") as z:
              z.writestr("mimetype", "application/epub+zip", compress_type=zipfile.ZIP_STORED)
              z.writestr("META-INF/container.xml", """<?xml version="1.0"?>
          <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
            <rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
          </container>""")
              z.writestr("OEBPS/content.opf", """<?xml version="1.0"?>
          <package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid">
            <metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="bookid">ruvoice-smoke</dc:identifier><dc:title>Smoke Test</dc:title><dc:language>ru</dc:language></metadata>
            <manifest><item id="chapter" href="chapter.xhtml" media-type="application/xhtml+xml"/></manifest>
            <spine><itemref idref="chapter"/></spine>
          </package>""")
              z.writestr("OEBPS/chapter.xhtml", """<?xml version="1.0" encoding="utf-8"?>
          <html xmlns="http://www.w3.org/1999/xhtml"><head><title>Smoke</title></head><body><p>Проверка локальной обработки книги для приложения RuVoice.</p></body></html>""")
          '@ | py - $epub

          $process = Start-Process -FilePath $exe -ArgumentList @(
            "--no-browser", "--port", "$port", "--private-home", "$privateHome"
          ) -PassThru -WindowStyle Hidden
          try {
            $page = $null
            for ($i = 0; $i -lt 45; $i++) {
              if ($process.HasExited) {
                throw "Portable server exited early with code $($process.ExitCode)"
              }
              try {
                $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -TimeoutSec 2
                if ($page.StatusCode -eq 200 -and $page.Content.Contains("Дополнение словаря RuVoice")) {
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if ($null -eq $page -or $page.StatusCode -ne 200) {
              throw "Portable Windows executable did not serve the local page"
            }

            $tokenMatch = [regex]::Match($page.Content, 'name="token" value="([^"]+)"')
            if (-not $tokenMatch.Success) {
              throw "The local upload form did not expose its request token"
            }
            $form = @{
              token = $tokenMatch.Groups[1].Value
              book = Get-Item -LiteralPath $epub
            }
            $upload = Invoke-WebRequest -Uri "http://127.0.0.1:$port/upload" -Method Post -Form $form -TimeoutSec 120
            if ($upload.StatusCode -ne 200 -or -not $upload.Content.Contains("ZIP готов")) {
              throw "Portable upload and processing did not return a ZIP link"
            }
            $downloadMatch = [regex]::Match($upload.Content, 'href="(/download/[^"]+)"')
            if (-not $downloadMatch.Success) {
              throw "The result page did not contain a ZIP download link"
            }
            Invoke-WebRequest -Uri ("http://127.0.0.1:$port" + $downloadMatch.Groups[1].Value) -OutFile $zip -TimeoutSec 30

            if (-not (Test-Path (Join-Path $privateHome "RuVoice_Accumulated_Approved.txt"))) {
              throw "Processing did not create the private append-only master"
            }
            if ((Get-ChildItem (Join-Path $privateHome "incoming") -File).Count -ne 0) {
              throw "Temporary uploaded book files were not removed"
            }
            py -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); n=set(z.namelist()); required={'MyBooks_Cumulative.txt','MyBooks_History.json','IMPORT.txt','Book_Report.json'}; assert required.issubset(n), sorted(n); assert any(x.endswith('_New_Stress_Delta.txt') for x in n), sorted(n)" $zip
            if ($LASTEXITCODE -ne 0) {
              throw "The downloaded archive did not contain all expected book-package files"
            }
            Write-Host "PASS: packaged EXE uploaded a synthetic EPUB, processed it locally and returned a valid ZIP"
          } finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "RuVoiceBookTool-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "ruvoice-win-build\dist\RuVoiceBookTool.exe") $stage
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "experiments\ruvoice-stress-dictionary\Start_RuVoice_Book_Tool_Windows.bat") $stage
          @'
          RuVoice Book Tool — Windows x64

          1. Распакуйте весь ZIP в отдельную папку.
          2. Дважды щёлкните Start_RuVoice_Book_Tool_Windows.bat.
          3. Дождитесь открытия страницы в браузере. Используйте адрес 127.0.0.1.
          4. Не закрывайте чёрное окно, пока работает локальная страница.
          5. Ctrl+C в этом окне останавливает сервер.

          Python отдельно устанавливать не требуется.
          Личный накопительный словарь и ZIP сохраняются в:
          %USERPROFILE%\.ruvoice-book-workflow

          Эта папка локальная и не зашифрована. Сделайте резервную копию MyBooks_Cumulative.txt.
          '@ | Set-Content -Encoding UTF8 (Join-Path $stage "START_HERE.txt")
          $archive = Join-Path $env:RUNNER_TEMP "RuVoiceBookTool-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -Force

      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RuVoiceBookTool-Windows-x64
          path: ${{ runner.temp }}/RuVoiceBookTool-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
