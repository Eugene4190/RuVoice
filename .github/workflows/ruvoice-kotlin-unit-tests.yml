name: RuVoice Kotlin stress-merge unit tests

on:
  pull_request:
    paths:
      - "project/ruvoice-1.1.3-stage4.9/app/src/main/java/**"
      - "project/ruvoice-1.1.3-stage4.9/app/src/test/java/**"
      - "project/ruvoice-1.1.3-stage4.9/app/build.gradle.kts"
      - "project/ruvoice-1.1.3-stage4.9/build.gradle.kts"
      - "project/ruvoice-1.1.3-stage4.9/settings.gradle.kts"
      - "project/ruvoice-1.1.3-stage4.9/buildSrc/**"
      - "private-files/paired_eval/UploadedEpubPairedEvaluation.kt"
      - ".github/workflows/ruvoice-kotlin-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-merge-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install pinned Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          TOOL_ZIP="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest" "$RUNNER_TEMP/android-cli-unpack"
          curl --fail --location --retry 3 --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$TOOL_ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $TOOL_ZIP" | sha256sum --check
          unzip -q "$TOOL_ZIP" -d "$RUNNER_TEMP/android-cli-unpack"
          cp -a "$RUNNER_TEMP/android-cli-unpack/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download ExecuTorch Android runtime AAR
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 --silent --show-error \
            https://ossci-android.s3.amazonaws.com/executorch/release/1.5.0-xnnpack/executorch.aar \
            --output app/libs/executorch-1.5.0-xnnpack.aar
          unzip -tq app/libs/executorch-1.5.0-xnnpack.aar
          unzip -l app/libs/executorch-1.5.0-xnnpack.aar | grep -q 'classes.jar'

      - name: Compile the complete whole-book paired evaluator
        shell: bash
        run: |
          set -euo pipefail
          TARGET="project/ruvoice-1.1.3-stage4.9/app/src/test/java/ru/kost/ruvoice/text"
          mkdir -p "$TARGET"
          cp private-files/paired_eval/UploadedEpubPairedEvaluation.kt "$TARGET/UploadedEpubPairedEvaluation.kt"
          gradle --no-daemon --stacktrace \
            :app:compileFullDebugUnitTestKotlin

      - name: Run focused Full and Lite JVM tests (no APK build)
        working-directory: project/ruvoice-1.1.3-stage4.9
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testFullDebugUnitTest \
            --tests "ru.kost.ruvoice.text.StressCorrectionMergerTest"
          gradle --no-daemon --stacktrace \
            :app:testLiteDebugUnitTest \
            --tests "ru.kost.ruvoice.text.StressCorrectionMergerTest"
