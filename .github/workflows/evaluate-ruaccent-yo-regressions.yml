name: Evaluate RUAccent ё regression contexts

on:
  push:
    branches: [main]
    paths:
      - "project/ruvoice-1.1.3-stage4.9/tools/probe_ruaccent_yo.py"
      - "project/ruvoice-1.1.3-stage4.9/tools/data/ruaccent_yo_book_regressions.json"
      - "project/ruvoice-1.1.3-stage4.9/app/src/main/java/ru/kost/ruvoice/text/IndependentStressCorrection.kt"
      - "project/ruvoice-1.1.3-stage4.9/app/src/main/java/ru/kost/ruvoice/text/RuAccentOnnxCorrector.kt"
      - ".github/workflows/evaluate-ruaccent-yo-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-yo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 tokenizers==0.22.2 onnxruntime==1.22.0

      - name: Download and verify the pinned ё classifier
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: |
          set -euo pipefail
          python tools/probe_ruaccent_yo.py download "$RUNNER_TEMP/ruaccent-yo"

      - name: Evaluate the 29 exact book contexts
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/ruaccent-yo-book-regressions.json"
          python tools/probe_ruaccent_yo.py evaluate "$RUNNER_TEMP/ruaccent-yo" \
            --corpus tools/data/ruaccent_yo_book_regressions.json --json > "$REPORT"
          python - "$REPORT" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("## RUAccent ё context diagnostics")
          print(f"- Checks: {report['passed']}/{report['total_checks']} matched")
          print(f"- Mismatches: {report['mismatches']}; missing: {report['missing']}")
          print("- These are raw classifier predictions, before the RuVoice dictionary and merge policy.")
          print("- This diagnostic set is targeted; it is not a general accuracy benchmark.")
          for case in report["cases"]:
              for check in case["checks"]:
                  conf = check.get("confidence")
                  value = "n/a" if conf is None else f"{conf:.4f}"
                  print(f"- `{case['id']}`: {check['word']} — expected {check['expected']}, "
                        f"predicted {check['actual']} (confidence {value})")
          PY

      - name: Upload classifier diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ruaccent-yo-book-regressions
          path: ruaccent-yo-book-regressions.json
          if-no-files-found: error
          retention-days: 30
