name: Verify real RUAccent ONNX inference

on:
  push:
    branches: [main]
    paths:
      - "project/ruvoice-1.1.3-stage4.9/app/src/main/java/ru/kost/ruvoice/text/**"
      - "project/ruvoice-1.1.3-stage4.9/native/**"
      - "project/ruvoice-1.1.3-stage4.9/tools/test_ruaccent_full_onnx_smoke.kt"
      - "project/ruvoice-1.1.3-stage4.9/tools/run_ruaccent_full_onnx_smoke.sh"
      - ".github/workflows/verify-ruaccent-android-port.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-onnx-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip \
            --output /tmp/kotlin-compiler.zip
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  /tmp/kotlin-compiler.zip" | sha256sum --check
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Download pinned RUAccent bundle and run production Kotlin inference
        working-directory: project/ruvoice-1.1.3-stage4.9
        run: bash tools/run_ruaccent_full_onnx_smoke.sh
