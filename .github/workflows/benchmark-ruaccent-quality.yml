name: RUAccent quality evaluation on gold Russian corpus

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-ruaccent-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python baseline environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stock RuVoice benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 silero-stress==1.5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip \
            --output /tmp/kotlin-compiler.zip
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  /tmp/kotlin-compiler.zip" | sha256sum --check
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Run production Kotlin RUAccent against gold corpora
        run: bash benchmarks/run_ruaccent_quality.sh

      - name: Upload full evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ruaccent-quality-evaluation
          path: project/ruvoice-1.1.3-stage4.9/app/build/ruaccent_quality_report.json
          if-no-files-found: error
          retention-days: 30
